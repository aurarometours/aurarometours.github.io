<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f2ee">
<title>A.M Studio — Pannello</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23c7754c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<div id="login" class="login" hidden>
  <div class="login-media"><img src="media/photo-c3b59e5e049c.webp" alt=""><div class="login-caption"><span>Chroma Delay</span><span>Pentax KM · 35 mm</span></div></div>
  <form class="login-panel" id="loginForm" autocomplete="off">
    <div class="logo-mark lg">A<i></i>M</div>
    <div>
      <h1>Bentornato,<br>Alessandro.</h1>
      <p class="muted">Accedi al pannello del tuo sito.</p>
    </div>
    <label class="field"><span>Email</span><input value="studio@alessandromoruzzi.com" readonly></label>
    <label class="field"><span>Password</span><input type="password" value="••••••••••••" readonly></label>
    <button class="btn primary lg" type="submit"><span>Accedi</span><svg class="i"><use href="#i-arrow-right"/></svg></button>
    <p class="login-foot">Connessione protetta · Sessione su questo dispositivo</p>
  </form>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" data-go="dashboard">
      <div class="logo-mark">A<i></i>M</div>
      <div class="brand-text"><b>Studio</b><span>alessandromoruzzi.com</span></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="site-status"><span class="pulse"></span><div><b>Sito online</b><span id="lastPublish">Ultima pubblicazione —</span></div></div>
      <button class="user" data-go="settings">
        <span class="avatar">AM</span>
        <span class="user-text"><b>Alessandro Moruzzi</b><small>Proprietario</small></span>
        <svg class="i sm"><use href="#i-settings"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="workspace">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Apri menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <button class="search-trigger" id="searchBtn"><svg class="i sm"><use href="#i-search"/></svg><span>Cerca…</span><kbd id="kbd">Ctrl K</kbd></button>
        <button class="icon-btn" id="themeBtn" aria-label="Cambia tema"><svg class="i"><use href="#i-moon"/></svg></button>
        <button class="icon-btn" id="bellBtn" aria-label="Notifiche"><svg class="i"><use href="#i-bell"/></svg><span class="dot-badge" id="bellDot"></span></button>
        <button class="btn ghost hide-sm" id="viewSite"><svg class="i sm"><use href="#i-eye"/></svg>Vedi sito</button>
        <button class="btn primary" id="publishBtn"><span>Pubblica</span><span class="count" id="changeCount">0</span></button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="drawer-wrap" id="drawerWrap" hidden><div class="drawer" id="drawer" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="popover" id="popover" hidden></div>
